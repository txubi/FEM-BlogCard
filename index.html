<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/style.css" />
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: var(--att-blue);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="heading-img" src="img/illustration-article.svg" alt="" />
      <section class="blog-card-body">
        <div class="blog-text">
          <span class="pill text-preset-4">Learning</span>
          <p class="publish-date text-preset-5">
            Published <date>21 Dec 2023</date>
          </p>
          <h1 class="text-preset-1" id="heading">HTML & CSS foundations</h1>
          <p class="body-text text-preset-2">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <span class="author text-preset-3"> Greg Hooper </span>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
